[[redirects]]
  from = "/api/*"
  to = "https://midware-server-wsig.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
# Enable Gzip and Brotli compression for all files
for = "/*"
[headers.values]
  Content-Encoding = "gzip"

