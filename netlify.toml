[[redirects]]
  from = "/api/*"
  to = "https://midware-server-wsig.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
# Enable Gzip and Brotli compression for all files
for = "/*"
[headers.values]
  Content-Encoding = "gzip"

[[headers]]
# Cache static assets (CSS, JS, images) for a long time
for = "/static/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Cache JavaScript files
for = "/*.js"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Cache CSS files
for = "/*.css"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Cache images
for = "/images/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Preload critical JavaScript and CSS files
for = "/*.js"
[headers.values]
  Link = "</main.js>; rel=preload; as=script"

[[headers]]
for = "/*.css"
[headers.values]
  Link = "</styles.css>; rel=preload; as=style"

[[headers]]
# Enable lazy loading for images
for = "/images/*"
[headers.values]
  Lazy-Load = "true"

[[headers]]
# Disable caching for HTML to ensure fresh content is always served
for = "/*.html"
[headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
# Enable security headers
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"